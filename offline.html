<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ledgerly — Offline</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); display: grid; place-items: center; color: #0f172a; background: radial-gradient(circle at 15% 10%, rgba(59,130,246,.17), transparent 30%), #f8fafc; }
    main { width: min(440px, 100%); padding: 30px; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; box-shadow: 0 24px 60px rgba(15,23,42,.12); }
    .mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; color: #fff; font-size: 1.35rem; font-weight: 900; background: linear-gradient(145deg, #3b82f6, #1d4ed8); }
    h1 { margin: 24px 0 10px; letter-spacing: -.04em; }
    p { margin: 0; color: #64748b; line-height: 1.6; }
    button { width: 100%; min-height: 46px; margin-top: 24px; padding: 11px 16px; border: 0; border-radius: 12px; color: #fff; font: inherit; font-weight: 800; background: #2563eb; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">L</div>
    <h1>Ledgerly is offline</h1>
    <p>Your financial information is stored securely in Supabase and is not copied into the public app cache. Reconnect to the internet, then try again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
